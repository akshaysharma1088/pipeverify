name: metrics
# GitHub keeps traffic data for 14 days only. This saves it, plus stars, forks, PyPI downloads and
# Zenodo stats, into metrics/ every few days so the full history is kept.
on:
  schedule:
    - cron: "17 6 * * 1,4"   # Monday and Thursday
  workflow_dispatch:
permissions:
  contents: write
concurrency: metrics
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect
        env:
          # A fine-grained token with "Administration: read" on this repo. Without it, traffic is skipped.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          PYPI_PACKAGE: pipeverify
          ZENODO_RECORDS: "23542278,23544371"
        run: python scripts/collect_metrics.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || git commit -m "metrics: update $(date -u +%F) [skip ci]"
          git push
